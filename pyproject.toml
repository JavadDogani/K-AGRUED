[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kagrued"
version = "1.0.0"
description = "K-AGRUED: proactive container autoscaling with an attention-based GRU encoder-decoder"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Javad Dogani" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.1"]

[project.optional-dependencies]
paper = ["matplotlib>=3.7", "scikit-learn>=1.3", "scipy>=1.10", "tensorflow>=2.13"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Paper = "https://doi.org/10.1007/s10723-022-09634-x"
Repository = "https://github.com/JavadDogani/K-AGRUED"

[tool.setuptools]
packages = ["kagrued"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["FIFA_dataset", "NASA_dataset"]
